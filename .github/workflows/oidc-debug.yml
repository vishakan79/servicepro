name: oidc-debug
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > /tmp/d.py <<'PY'
          import sys, os, json, base64, urllib.request
          req = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com', headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          t = json.load(urllib.request.urlopen(req))['value']
          s = t.split('.')[1]; s += '=' * (-len(s) % 4)
          d = json.loads(base64.urlsafe_b64decode(s))
          print('::notice::' + str({k: d.get(k) for k in ('iss', 'aud', 'sub', 'repository', 'ref')}))
          PY
          python3 /tmp/d.py
