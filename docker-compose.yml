# Local production-like stack: PostgreSQL + Redis + API. Run:  cp .env.example .env  (fill it in)  &&  docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldservicely}
      POSTGRES_USER: ${DB_USER:-fieldservicely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fieldservicely} -d ${DB_NAME:-fieldservicely}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-fieldservicely}
      DB_USER: ${DB_USER:-fieldservicely}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_SSLMODE: disable # internal compose network only; keep "require" against Neon or RDS
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?set in .env (>= 32 bytes)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-servicepro-ad08e}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  pg-data:
  redis-data:
